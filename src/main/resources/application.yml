
spring:
  application:
    name: winnerownner_webserver
  datasource:
    url: jdbc:h2:~/wo
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      ddl-auto: create
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
